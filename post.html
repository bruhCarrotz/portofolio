<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Writing — Anastasia Riana</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .post-page {
      max-width: 700px;
      margin: 0 auto;
      padding: 7rem 2rem 6rem;
      min-height: 100vh;
    }

    .post-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
      text-decoration: none;
      margin-bottom: 3rem;
      transition: color 0.2s;
    }

    .post-back::before { content: '←'; font-size: 14px; }
    .post-back:hover { color: var(--ink); }

    /* ── POST BODY TYPOGRAPHY ── */
    .post-body h1 { font-family: var(--serif); font-size: clamp(2rem, 4vw, 3rem); font-weight: 300; line-height: 1.15; margin-bottom: 0.5rem; }
    .post-body h2 { font-family: var(--serif); font-size: 1.6rem; font-weight: 300; margin: 2.5rem 0 0.75rem; }
    .post-body h3 { font-family: var(--serif); font-size: 1.25rem; font-weight: 400; margin: 2rem 0 0.5rem; }
    .post-body p  { font-size: 16px; line-height: 1.9; margin-bottom: 1.15rem; }
    .post-body ul,
    .post-body ol { margin: 0.75rem 0 1.25rem 1.5rem; font-size: 16px; line-height: 1.85; }
    .post-body li { margin-bottom: 0.35rem; }
    .post-body strong { font-weight: 500; }
    .post-body em { font-style: italic; color: var(--ink-muted); }
    .post-body code { font-family: monospace; font-size: 13px; background: #fff; border: 1px solid var(--border); padding: 2px 6px; border-radius: 2px; }
    .post-body blockquote { border-left: 2px solid var(--accent); padding: 0.25rem 0 0.25rem 1.25rem; color: var(--ink-muted); font-style: italic; margin: 1.5rem 0; }
    .post-body hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
    .post-body img { max-width: 100%; border-radius: 4px; margin: 1.5rem 0; }
    .post-body a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
    .post-body a:hover { opacity: 0.75; }

    /* ── POST META ── */
    .post-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 12px;
      color: var(--ink-faint);
      letter-spacing: 0.06em;
      margin-bottom: 2.5rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
    }

    .post-meta .blog-tag {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-light);
      padding: 3px 9px;
      border-radius: 2px;
    }

    /* ── CALLOUT BOXES (optional, use in post HTML) ── */
    .post-body .callout {
      background: var(--accent-light);
      border-left: 3px solid var(--accent);
      padding: 1rem 1.25rem;
      border-radius: 0 4px 4px 0;
      margin: 1.5rem 0;
      font-size: 15px;
      color: var(--ink-muted);
    }

    .post-body .callout strong { color: var(--ink); }

    /* ── ERROR STATE ── */
    .post-error { padding: 3rem 0; color: var(--ink-muted); font-size: 15px; }
    .post-error a { color: var(--accent); text-decoration: none; }

    /* ── LOADING STATE ── */
    .post-loading {
      color: var(--ink-faint);
      font-size: 14px;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Anastasia Riana</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="index.html#projects">Projects</a></li>
    <li><a href="index.html" class="active">Writing</a></li>
  </ul>
</nav>

<main class="post-page">
  <a class="post-back" href="index.html">All Writing</a>
  <article class="post-body" id="post-body">
    <p class="post-loading">Loading…</p>
  </article>
</main>

<footer>
  <span>&copy; 2026 Anastasia Riana</span>
  <ul class="footer-links">
    <li><a href="https://www.linkedin.com/in/anastasiariana/" target="_blank">LinkedIn</a></li>
    <li><a href="mailto:riana.anastasia481@gmail.com">Email</a></li>
  </ul>
</footer>

<script src="posts.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');
  const body = document.getElementById('post-body');

  const post = POSTS.find(p => p.slug === slug);

  if (!post) {
    body.innerHTML =
      '<div class="post-error">Post not found.' +
      '<br><br><a href="index.html">← Back to Writing</a></div>';
  } else {
    document.title = post.title + ' — Anastasia Riana';

    fetch('posts/' + post.slug + '.html')
      .then(function(res) {
        if (!res.ok) throw new Error('Not found');
        return res.text();
      })
      .then(function(html) {
        body.innerHTML = html;
      })
      .catch(function() {
        body.innerHTML =
          '<div class="post-error">Could not load post content.' +
          '<br><br><a href="index.html">← Back to Writing</a></div>';
      });
  }
</script>
</body>
</html>
